server {
  listen 80;
  server_name your.frontend.domain;

  root /var/www/cpm-frontend;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://BACKEND_PRIVATE_IP:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
